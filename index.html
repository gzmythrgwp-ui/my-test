<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .container {
    background: #16213e;
    padding: 30px;
    border-radius: 15px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }
  h1 { text-align: center; color: #e94560; }
  .question {
    font-size: 20px;
    margin-bottom: 20px;
    min-height: 50px;
  }
  .answers button {
    display: block;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    background: #0f3460;
    color: #eee;
    border: 2px solid #e94560;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    text-align: left;
  }
  .answers button:hover {
    background: #e94560;
    transform: translateX(5px);
  }
  .answers button.correct { background: #2ecc71; border-color: #2ecc71; }
  .answers button.wrong { background: #c0392b; border-color: #c0392b; }
  .answers button:disabled { cursor: not-allowed; opacity: 0.7; }
  .status {
    margin-top: 20px;
    padding: 15px;
    background: #0f3460;
    border-radius: 8px;
    text-align: center;
  }
  .insult {
    font-style: italic;
    color: #e94560;
    margin-top: 10px;
    min-height: 24px;
  }
  .progress {
    height: 8px;
    background: #0f3460;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #f39c12);
    width: 0%;
    transition: width 0.3s;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Тест</h1>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div id="question" class="question"></div>
  <div id="answers" class="answers"></div>
  <div class="status">
    <div id="score">Ошибок: 0 / 3</div>
    <div id="insult" class="insult"></div>
  </div>
</div>

<script>
// ==== БАЗА ВОПРОСОВ ====
const allQuestions = [
  { q: "как нужно со мной гулять?", a: ["не обижать меня", "уделять мне внимание ", "уделять мне внимание и не обижать ", "не ныть что хочется домой "], correct: 2 },
  { q: "как нужно отвечать мне когда я жалуюсь ??", a: ["говорить мне хватит ныть", "поныть со мной", "пожалеть", "пожалеть и сказать чтл все мрази"], correct: 3 },
  { q: "что делать когда я обиделась?", a: ["обидеться тоже ", "обнять меня и если я сказала отстать то не отставать", "обнять и если я скажу отстать то отстать", "ничего не делать"], correct: 1 },
  { q: "как нужно реагировать когда ты что-то сделвл не так?", a: ["забить", "доказывать что ты прав ", "извиниться и больше так не делать", "извиниться"], correct: 2 },
  { q: "на что я больше всего обижусь?", a: ["я не хочу гулять", "хватит ныть", "я тебы не повезу, мне лень, езжай сама "], correct: 2 },
  { q: "нужно ли проявлять внимание к девушке как в начале отношений , если вы уже много вместе?", a: ["да", "нет"], correct: 1 },
  { q: "какое будет мое настроение если ты сделаешь не специально что-то плохое?", a: ["плохое", "хорошее", "нормальное", "пойдет"], correct: 3 },
  { q: "Кто изобрёл лампочку?", a: ["Тесла", "Эдисон", "Ньютон", "Эйнштейн"], correct: 1 },
  { q: "Сколько цветов в радуге?", a: ["5", "6", "7", "9"], correct: 2 },
  { q: "Язык программирования для веба?", a: ["Python", "JavaScript", "C++", "Java"], correct: 1 },
  { q: "Самое большое животное?", a: ["Слон", "Синий кит", "Жираф", "Бегемот"], correct: 1 },
  { q: "Год первого полёта человека в космос?", a: ["1957", "1961", "1969", "1975"], correct: 1 },
  { q: "Сколько сторон у шестиугольника?", a: ["5", "6", "7", "8"], correct: 1 },
  { q: "Кто написал 'Гарри Поттера'?", a: ["Толкин", "Роулинг", "Мартин", "Льюис"], correct: 1 },
  { q: "Главный герой 'Преступления и наказания'?", a: ["Пьер", "Раскольников", "Онегин", "Базаров"], correct: 1 },
];

// ==== ОСКОРБЛЕНИЯ ====
const insults = [
  "Ты вообще меня не знаешь…",
  "Я плохой. Я это признаю.",
  "Ты даже не пытаешься понять меня.",
  "Может, я и правда никуда не гожусь…",
  "Ты меня совсем не знаешь.",
  "Я разочаровываю всех. И тебя тоже.",
  "Ну кто я такой, чтобы ты меня слушал?",
  "Я не стою твоего внимания.",
];

// ==== СОСТОЯНИЕ ====
let usedQuestions = [];
let currentQuestion = null;
let wrongCount = 0;
const MAX_WRONG = 3;
const TOTAL_QUESTIONS = 10;
let askedCount = 0;

const qEl = document.getElementById('question');
const aEl = document.getElementById('answers');
const scoreEl = document.getElementById('score');
const insultEl = document.getElementById('insult');
const progressEl = document.getElementById('progress');

// Перемешать массив
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Получить новый вопрос (не из уже использованных в текущей сессии)
function getNextQuestion() {
  let pool = allQuestions.filter(q => !usedQuestions.includes(q));
  if (pool.length === 0) {
    // Если вопросы закончились — сбрасываем
    usedQuestions = [];
    pool = [...allQuestions];
  }
  const picked = pool[Math.floor(Math.random() * pool.length)];
  usedQuestions.push(picked);
  return picked;
}

function showInsult() {
  insultEl.textContent = insults[Math.floor(Math.random() * insults.length)];
}

function updateScore() {
  scoreEl.textContent = `Ошибок: ${wrongCount} / ${MAX_WRONG}  |  Вопрос: ${askedCount}`;
  progressEl.style.width = (askedCount / TOTAL_QUESTIONS * 100) + '%';
}

function loadQuestion() {
  if (askedCount >= TOTAL_QUESTIONS && wrongCount < MAX_WRONG) {
    finish(true);
    return;
  }
  if (wrongCount >= MAX_WRONG) {
    // Превышен лимит — сбрасываем вопросы и продолжаем
    wrongCount = 0;
    askedCount = 0;
    usedQuestions = [];
    insultEl.textContent = "";
    // Показать сообщение
    qEl.textContent = "Слишком много ошибок. Начнём заново…";
    aEl.innerHTML = "";
    setTimeout(() => {
      askedCount = 0;
      loadQuestion();
    }, 1500);
    return;
  }

  currentQuestion = getNextQuestion();
  askedCount++;
  updateScore();

  qEl.textContent = currentQuestion.q;
  aEl.innerHTML = "";
  insultEl.textContent = "";

  // Перемешиваем ответы, но запоминаем правильный
  const indexed = currentQuestion.a.map((text, i) => ({ text, isCorrect: i === currentQuestion.correct }));
  const shuffled = shuffle(indexed);

  shuffled.forEach((ans, i) => {
    const btn = document.createElement('button');
    btn.textContent = ans.text;
    btn.onclick = () => handleAnswer(btn, ans.isCorrect);
    aEl.appendChild(btn);
  });
}

function handleAnswer(btn, isCorrect) {
  // Блокируем все кнопки
  [...aEl.children].forEach(b => {
    b.disabled = true;
    if (b.textContent === currentQuestion.a[currentQuestion.correct]) {
      b.classList.add('correct');
    }
  });

  if (!isCorrect) {
    btn.classList.add('wrong');
    wrongCount++;
    updateScore();
    showInsult();

    if (wrongCount >= MAX_WRONG) {
      setTimeout(() => {
        loadQuestion(); // сброс произойдёт внутри
      }, 1800);
      return;
    }
  } else {
    insultEl.textContent = "";
  }

  setTimeout(loadQuestion, 1200);
}

function finish(success) {
  qEl.textContent = success ? "✅ Ты прошёл тест!" : "❌ Попробуй ещё раз";
  aEl.innerHTML = "";
  insultEl.textContent = success ? "Ладно… может, ты меня и знаешь." : "";
}

// Запуск
loadQuestion();
</script>
</body>
</html>
